openapi: 3.1.0
info:
  title: Document Uploader
  description: Uploads and categorises documents
  termsOfService: https://docs.api.europace.de/terms/
  contact:
    name: Europace Unterlagenakte Support
    url: https://developer.europace.de
    email: unterlagen@europace.de
  version: 1.0.0
servers:
- url: https://mtp.europace2.de
  description: PS
- url: https://api-mtp.europace2.de
  description: MTP
tags:
- name: Document Upload
  description: Uploads and categorises documents to Unterlagenakte
- name: Unterlagenakte
  description: Unterlagenakte API
paths:
  /v2/dokumente:
    post:
      tags:
      - Document Upload
      summary: Upload Document via URL
      description: Uploads a document by providing a URL to the file.
      operationId: upload
      requestBody:
        description: Upload request via URL
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlUploadRequest"
        required: true
      responses:
        "200":
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid upload request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Cannot find category [INVALID]"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Connection error to foreign host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Connection to foreign host lost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v2/dokumente/file:
    post:
      tags:
      - Document Upload
      summary: Upload Document via File
      description: Uploads a document as multipart/form-data to the Unterlagenakte.
        Also possible without /file suffix.
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              - caseId
              type: object
              properties:
                assignmentId:
                  type: string
                  description: Assignment ID for upload context
                  example: 886c8da8-cad6-4a9e-ac7c-fad54e4aff7c
                caseId:
                  type: string
                  description: The case ID where the document is to be uploaded
                  example: 123ABC
                category:
                  type: string
                  description: Category assigned to the document
                  example: Ausweis
                displayName:
                  type: string
                  maxLength: 200
                  description: >-
                    Maximum 200 Unicode code points before cleanup. Control characters and line/paragraph
                    separators are removed; other characters are preserved. Missing or blank names use the
                    sanitized original filename, or File_YYYY-MM-DD if unusable.
                  example: my file
                file:
                  type: string
                  description: The file to upload
                  format: binary
                preview:
                  type: boolean
                  description: Should a preview be generated?
                  default: true
      responses:
        "200":
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid upload request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Cannot find category [INVALID]"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Connection error to foreign host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Connection to foreign host lost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      required:
      - message
      - timestamp
      - traceId
      - utcTimestamp
      type: object
      properties:
        details:
          type: object
          additionalProperties:
            type: object
          example: {}
        message:
          type: string
          example: Invalid attribute
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          example: 363b7b15-30dd-42d5-aa59-9af1786ed1cf
        utcTimestamp:
          type: integer
          format: int64
          example: 1744302186082
    UploadResponse:
      required:
      - caseId
      - displayName
      - fileName
      - id
      type: object
      properties:
        caseId:
          type: string
          example: 123ABC
        displayName:
          type: string
          maxLength: 200
          description: Processed display name; falls back to the sanitized filename, then File_YYYY-MM-DD.
          example: my file
        fileName:
          type: string
          example: my_file.pdf
        id:
          type: string
          example: 22bac2af-a559-432c-9601-969256996bd9
    UrlUploadRequest:
      required:
      - caseId
      - url
      type: object
      properties:
        assignmentId:
          type: string
          example: 886c8da8-cad6-4a9e-ac7c-fad54e4aff7c
        caseId:
          minLength: 1
          type: string
          example: 123ABC
        category:
          type: string
          example: Ausweis
        displayName:
          type: string
          maxLength: 200
          description: >-
            Maximum 200 Unicode code points before cleanup. Control characters and line/paragraph
            separators are removed; other characters are preserved. Missing or blank names use the
            sanitized filename (provided or from the URL), or File_YYYY-MM-DD if unusable.
          example: my file
        filename:
          type: string
          example: my_file.pdf
        preview:
          type: boolean
        url:
          minLength: 1
          type: string
          example: https://picsum.photos/595/842
